<!DOCTYPE html> 
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RainyDays | Ecommerce Website Design</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/fontawesome.min.css">
</head>


<body>
    <header class="main-header">

        <!--Top rectangle-->
        <div class="header-top">

            <!--left column-->
            <div class="left-column">
                <div class="hamburger">☰</div>
                <div class="logo">
                    <img src="images/logo.png" width="125" alt="RainyDays Logo">
                </div>
            </div>

            <!--right column-->
            <div class="right-column">               
                <span>🔍</span>
                <span>👤 My site</span>
                <span>🛒</span>              
            </div>
        </div>


        <!--Bottom rectangle-->
        <nav class="navbar">
            <ul>
                <li><a href="/men">Men</a></li>
                <li><a href="/women">Women</a></li>
                <li><a href="/collections">Collections</a></li>
                <li><a href="/outlet">Outlet</a></li>
                <li><a href="/info">Info</a></li>
            </ul>
        </nav>
    </header>      
    
    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 class="headline">The Adventure Starts <br> 
                    With <span class="fancy-font">R</span> <span class="fancy-font-2">ainwear</span>
                </h1>
                <p class="hero-subtext">Discover weatherproof shell-jackets that keep your adventure alive</p>
            </div>

            <div class="card-one">
                <a href="#" class="button">View All Products</a>
            </div>

            <div class="card-two">
                <h2>FRONT PROOF</h2>
                <p>Some text here as well</p>
            </div>
        </section>

        <!--new arrivals-->
        <section class="new-arrivals">
            <div class="product-card">
                <h2>New Arrivals</h2>
                <div class="row">
                    <div class="col-4">
                        <img src="images/raincoat.jpg" alt="Yellow raincoat">
                        <h4>Raincoat</h4>
                        <p>799,-</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
